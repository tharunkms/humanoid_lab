base_global_planner: "global_planner/GlobalPlanner"
base_local_planner: "base_local_planner/TrajectoryPlannerROS"
controller_frequency: 5.0
planner_frequency: 1.0
planner_patience: 5.0
controller_patience: 15.0
conservative_reset_dist: 3.0
# Rotation recovery stays off: cmd_vel is remapped away from move_base, so it could never move the robot.
recovery_behavior_enabled: true
clearing_rotation_allowed: false

GlobalPlanner:
  # Disables the "precise start", which spreads the start potential over 4 cells so the
  # field's minimum lands on a cell the grid traceback never terminates on.
  old_navfn_behavior: true
  use_dijkstra: true
  use_grid_path: true
  use_quadratic: false
  default_tolerance: 1.0
  allow_unknown: true
  publish_potential: true

# Default clearable layer is "obstacles", but the pre-Hydro costmap config below
# creates the layer as "obstacle_layer", so clearing silently does nothing.
conservative_reset:
  layer_names: ["obstacle_layer"]
aggressive_reset:
  layer_names: ["obstacle_layer"]
